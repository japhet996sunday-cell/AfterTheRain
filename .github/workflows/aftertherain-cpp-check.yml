name: AfterTheRain C++ Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  cpp-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check C++ and header files
        shell: bash
        run: |
          set -e

          files=$(find Source -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.cs" \) | sort)

          test -n "$files"

          echo "Checking source files:"
          echo "$files"

          while IFS= read -r file; do
            test -s "$file"
          done <<< "$files"

          python3 - <<'PY'
          from pathlib import Path

          files = sorted(
              p for p in Path("Source").rglob("*")
              if p.is_file() and p.suffix in {".cpp", ".h", ".cs"}
          )

          for path in files:
              data = path.read_bytes()
              if b"\x00" in data:
                  print(f"ERROR: Null byte found in {path}")
                  raise SystemExit(1)

          print("✓ No null bytes found in C++/header/build-rule files")
          print("✓ All C++/header/build-rule files are non-empty and text-readable")
          PY

      - name: Check Unreal reflection macros
        shell: bash
        run: |
          set -e

          if grep -RInE 'UCLASS|USTRUCT|UENUM|UINTERFACE|UPROPERTY|UFUNCTION' Source/AfterTheRain --include="*.h" >/dev/null; then
            echo "✓ Unreal reflection macros found"
          else
            echo "ERROR: No Unreal reflection macros found"
            exit 1
          fi

      - name: Check generated Unreal folders are absent
        shell: bash
        run: |
          set -e

          for dir in Binaries Build DerivedDataCache Intermediate Saved; do
            if [ -d "$dir" ]; then
              echo "ERROR: Generated folder found: $dir"
              exit 1
            fi
          done

          echo "✓ No generated Unreal folders found"

      - name: C++ check passed
        run: echo "✓ AfterTheRain C++ source check passed"
